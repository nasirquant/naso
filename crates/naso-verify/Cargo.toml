[package]
name = "naso-verify"
version = "0.1.0"
edition = "2024"
description = "SMT-based formal verification engine for Naso language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"

[features]
default = ["z3"]
z3 = ["dep:z3", "dep:z3-sys"]

[dependencies]
# Core Naso compiler types
naso-compiler = { path = "../../compiler" }

# SMT Solver
z3 = { version = "0.21", optional = true }
z3-sys = { version = "0.13", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = { workspace = true }

# Data structures
indexmap = { workspace = true }
smallvec = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
tracing = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
dirs = "6.0"

# Parallel processing
rayon = "1.10"

# Hashing for cache
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.10"

[[example]]
name = "run_benchmarks"
path = "benchmarks/run_benchmarks.rs"