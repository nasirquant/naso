name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-naso/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build naso-lsp
        run: |
          cd ../../crates/naso-lsp
          cargo build --release
          
      - name: Install VS Code Extension dependencies
        run: |
          cd vscode-naso
          npm ci

      - name: Compile Extension
        run: |
          cd vscode-naso
          npm run compile

      - name: Lint Extension
        run: |
          cd vscode-naso
          npm run lint

      - name: Run Extension Tests
        uses: vscode/test-electron@v2
        with:
          extension-path: vscode-naso
          test-args: --extensionTestsPath=out/test/suite/index

      - name: Package Extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd vscode-naso
          npx vsce package --no-dependencies

      - name: Upload VSIX Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-naso-vsix
          path: vscode-naso/*.vsix
          retention-days: 30

  tree-sitter-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Build tree-sitter-naso parser
        run: |
          cd tree-sitter-naso
          tree-sitter generate
          tree-sitter build

      - name: Run tree-sitter tests
        run: |
          cd tree-sitter-naso
          tree-sitter test

      - name: Test WASM parser
        run: |
          cd tree-sitter-naso
          tree-sitter build-wasm
          node -e "
            const Parser = require('web-tree-sitter');
            const fs = require('fs');
            async function test() {
              await Parser.init();
              const parser = new Parser();
              const wasm = fs.readFileSync('naso.wasm');
              const lang = await Parser.Language.load(wasm);
              parser.setLanguage(lang);
              const tree = parser.parse('fn main() { let x: i32 = 42; }');
              console.log('WASM parser test passed:', tree.rootNode.type);
            }
            test();
          "

  lsp-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run LSP unit tests
        run: |
          cd crates/naso-lsp
          cargo test --all

      - name: Run LSP integration tests
        run: |
          cd crates/naso-lsp
          cargo test --test integration_test

      - name: Run diagnostic tests
        run: |
          cd crates/naso-lsp
          cargo test --test diagnostic_tests

  publish:
    needs: [build-and-test, tree-sitter-tests, lsp-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to VS Code Marketplace
        if: secrets.VSCE_PAT != ''
        run: |
          cd vscode-naso
          npx vsce publish -p ${{ secrets.VSCE_PAT }}

      - name: Publish tree-sitter-naso to NPM
        if: secrets.NPM_TOKEN != ''
        run: |
          cd tree-sitter-naso
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish