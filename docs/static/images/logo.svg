<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>
    <linearGradient id="facet-diagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000FF" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Crisp Glow -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="100" height="100" rx="22" fill="#0B0F19"/>

  <!-- 1. Full Isometric Quantum Lattice Grid -->
  <g opacity="0.12" stroke="#00F2FE" stroke-width="0.75" stroke-linecap="round">
    <path d="M 10 30 L 50 10 L 90 30 L 50 50 Z" />
    <path d="M 10 70 L 50 50 L 90 70 L 50 90 Z" />
    <path d="M 10 30 L 10 70" />
    <path d="M 50 10 L 50 90" />
    <path d="M 90 30 L 90 70" />
    <path d="M 10 50 L 50 30 L 90 50 L 50 70 Z" />
  </g>

  <!-- 2. Back Half of Orbital Ring (Dotted Line) -->
  <path d="M 18 55 A 36 12 0 0 1 82 45" transform="rotate(-25 50 50)" 
        stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="2.5 2.5" 
        opacity="0.5" fill="none" />

  <!-- 3. Isometric 3D 'N' Ribbon Manifold -->
  <!-- Left Pillar -->
  <path d="M 22 76 V 32 L 34 22 V 66 Z" fill="url(#facet-left)"/>
  
  <!-- Diagonal Ribbon -->
  <path d="M 34 22 L 78 68 L 66 78 L 22 32 Z" fill="url(#facet-diagonal)" filter="url(#subtle-glow)"/>

  <!-- Right Pillar -->
  <path d="M 66 78 V 34 L 78 24 V 68 Z" fill="url(#facet-right)"/>

  <!-- 4. Front Half of Orbital Ring (Solid Line) -->
  <path d="M 82 45 A 36 12 0 0 1 18 55" transform="rotate(-25 50 50)" 
        stroke="url(#ring-grad)" stroke-width="1.8" stroke-linecap="round" 
        fill="none" filter="url(#subtle-glow)" />
</svg>
